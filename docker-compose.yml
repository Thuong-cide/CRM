services:
  backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:***@postgres_db:5432/crm_db
      - JWT_SECRET=${JWT_SECRET:-crm_jwt_secret_2024}
      - RENEW_DAYS_BEFORE=${RENEW_DAYS_BEFORE:-7}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    networks:
      - crm-net
      - postgres-stack_default
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge
  postgres-stack_default:
    external: true
